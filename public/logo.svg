<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <title>FreeEats</title>
  <defs>
    <linearGradient id="pin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea9c76"/>
      <stop offset="0.6" stop-color="#d17a57"/>
      <stop offset="1" stop-color="#c46c62"/>
    </linearGradient>
    <clipPath id="tile"><rect width="64" height="64" rx="16"/></clipPath>
  </defs>

  <!-- the map -->
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="#f3ebdf"/>
    <path d="M-4 44 Q14 36 22 46 T40 58 L40 70 L-4 70 Z" fill="#cfe2c3"/>
    <path d="M44 -4 h24 v22 q-10 4 -18 -2 q-6 -6 -6 -20 Z" fill="#c9dfe8"/>
    <g stroke="#ffffff" stroke-linecap="round" fill="none">
      <path d="M-4 18 L68 30" stroke-width="5"/>
      <path d="M14 -4 L24 68" stroke-width="5"/>
      <path d="M46 68 L54 -4" stroke-width="3.5"/>
      <path d="M-4 54 L68 48" stroke-width="3"/>
    </g>
    <g stroke="#e2d6c6" stroke-linecap="round" fill="none" stroke-width="1.2" stroke-dasharray="2 3">
      <path d="M-4 18 L68 30"/>
      <path d="M14 -4 L24 68"/>
    </g>
  </g>

  <!-- the pin (drawn at 1x, scaled up so it stays readable at small sizes) -->
  <g transform="translate(32 31) scale(1.17) translate(-32 -32)">
  <ellipse cx="32" cy="56.5" rx="7.5" ry="2.2" fill="#3b302a" opacity="0.18"/>
  <path d="M32 56 C32 56 14.5 38.8 14.5 25.5 A17.5 17.5 0 0 1 49.5 25.5 C49.5 38.8 32 56 32 56 Z"
        fill="url(#pin)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="32" cy="25.5" r="11" fill="#ffffff"/>

  <!-- fork and knife -->
  <g stroke="#c4683f" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M26.9 19.2 v3.9 a1.9 1.9 0 0 0 3.8 0 v-3.9"/>
    <path d="M28.8 19.2 v4.4"/>
    <path d="M28.8 25 v7.4"/>
    <path d="M35.6 32.4 V19.2 c2.1 1 2.9 3.8 2.4 7.1 h-2.4"/>
  </g>
  <path d="M35.6 19.2 c2.1 1 2.9 3.8 2.4 7.1 h-2.4 Z" fill="#c4683f"/>
  </g>
</svg>
